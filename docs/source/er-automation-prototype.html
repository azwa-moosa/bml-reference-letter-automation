<title>Reference Letter Automation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: prototype header + sign-in switcher, then the OneUI portal frame (sidebar + content), matching the Employee Relations app */
:root{
  --bg:#f4f3f1; --panel:#f8f7f5; --surface:#ffffff; --line:#e4e1dc; --line-2:#efece8;
  --fg:#1d1b19; --muted:#6c6762; --faint:#9a958f;
  --accent:#b3141f; --accent-ink:#ffffff; --accent-soft:#fbe9ea;
  --green:#1d7a4c; --green-soft:#e2f3e9; --amber:#94600a; --amber-soft:#fbf0da;
  --blue:#2b5a96; --blue-soft:#e7eef8; --red:#b3141f; --red-soft:#fbe9ea; --grey-soft:#efedea;
  --paper:#ffffff; --ink:#1a1a1a; --fieldmark:#fff4c7; --tag-bg:#fbf0da; --tag-fg:#8a5a06;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --letter:"Tinos","Times New Roman",Times,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141312; --panel:#1a1918; --surface:#211f1d; --line:#35322e; --line-2:#2b2926;
  --fg:#ecebe8; --muted:#a8a29b; --faint:#7d7872;
  --accent:#e0454f; --accent-ink:#ffffff; --accent-soft:#3a1b1d;
  --green:#5cc391; --green-soft:#183326; --amber:#e3b25a; --amber-soft:#3a2d14;
  --blue:#8cb4ec; --blue-soft:#1a2a40; --red:#f07a80; --red-soft:#3a1b1d; --grey-soft:#2b2926;
  --paper:#fbfaf7; --ink:#1a1a1a; --fieldmark:#fff1b8; --tag-bg:#3a2d14; --tag-fg:#e3b25a;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141312; --panel:#1a1918; --surface:#211f1d; --line:#35322e; --line-2:#2b2926;
  --fg:#ecebe8; --muted:#a8a29b; --faint:#7d7872;
  --accent:#e0454f; --accent-ink:#ffffff; --accent-soft:#3a1b1d;
  --green:#5cc391; --green-soft:#183326; --amber:#e3b25a; --amber-soft:#3a2d14;
  --blue:#8cb4ec; --blue-soft:#1a2a40; --red:#f07a80; --red-soft:#3a1b1d; --grey-soft:#2b2926;
  --paper:#fbfaf7; --ink:#1a1a1a; --fieldmark:#fff1b8; --tag-bg:#3a2d14; --tag-fg:#e3b25a;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1260px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{flex:none;display:block}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--accent)}
.head h1{margin:6px 0 0;font-size:26px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.tag{font-family:var(--mono);font-size:11.5px;background:var(--tag-bg);color:var(--tag-fg);padding:4px 8px;border-radius:3px}
.signin{margin-top:22px;display:grid;gap:8px;max-width:460px}
.signin select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:15px;font-weight:600}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);margin-top:10px}
.todo{background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px}
.frame{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;grid-template-columns:236px minmax(0,1fr);min-height:640px;overflow:hidden}
.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;min-width:0}
.brand{display:flex;gap:11px;align-items:center;padding:0 4px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand b{font-size:13.5px;display:block}.brand b em{font-style:normal;color:var(--accent)}
.brand small{color:var(--muted);font-size:11.5px}
.navwrap{display:grid;gap:16px}
.navsec{display:grid;gap:3px}
.navsec>span{font-size:12px;color:var(--muted);font-weight:500;padding:4px 8px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;width:100%;color:var(--fg)}
.nav:hover{background:var(--surface)}
.nav.on{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.nav.stub{color:var(--muted)}
.nav .lab{flex:1;min-width:0}
.badge{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.newtag{font-size:10.5px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line)}
.crumb{flex:1;min-width:0;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb b{color:var(--fg);font-weight:600}
.top .role{font-weight:600;font-size:13px}
.iconbtn{border:none;background:none;padding:6px;border-radius:6px;cursor:pointer;color:var(--muted);position:relative}
.iconbtn:hover{background:var(--surface);color:var(--fg)}
.iconbtn .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.content{padding:26px 24px 40px;display:grid;gap:22px;align-content:start;min-width:0}
.pg h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.pg p{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:72ch}
.back{background:none;border:none;color:var(--muted);cursor:pointer;display:inline-flex;gap:4px;align-items:center;padding:0;font-weight:500}
.back:hover{color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;font-weight:600}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:inset 4px 0 0 var(--accent)}
.banner .txt{flex:1;min-width:220px}
.banner b{font-size:15.5px}.banner span{display:block;color:var(--muted)}
.tile{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.t-red{background:var(--accent-soft);color:var(--accent)}.t-green{background:var(--green-soft);color:var(--green)}
.t-amber{background:var(--amber-soft);color:var(--amber)}.t-blue{background:var(--blue-soft);color:var(--blue)}.t-grey{background:var(--grey-soft);color:var(--muted)}
.seclabel{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 -10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line-2);cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left}
.row:first-child{border-top:none}
.row:hover{background:var(--panel)}
.row .txt{flex:1;min-width:0}
.row .t1{font-weight:600;font-size:15px}
.row .t2{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row .chev{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-green{background:var(--green-soft);color:var(--green)}.p-amber{background:var(--amber-soft);color:var(--amber)}
.p-blue{background:var(--blue-soft);color:var(--blue)}.p-red{background:var(--red-soft);color:var(--red)}.p-grey{background:var(--grey-soft);color:var(--muted)}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--amber);background:var(--amber-soft);border-radius:4px;padding:1px 6px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;border:1px solid transparent;font-size:14px}
.btn-p{background:var(--accent);color:var(--accent-ink)}.btn-p:hover{filter:brightness(.93)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--fg)}.btn-g:hover{background:var(--panel)}
.btn-s{padding:6px 11px;font-size:13px}
.btn-q{background:none;color:var(--red);padding-inline:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn:focus-visible,.nav:focus-visible,.row:focus-visible,.choice:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,.fbtn:focus-visible,tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);gap:7px 14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.choice{display:flex;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;align-items:flex-start}
.choice:hover{border-color:var(--accent)}
.choice b{display:block;font-size:15px}.choice span{display:block;color:var(--muted);margin-top:2px}
.choice small{display:block;margin-top:8px;font-size:12.5px;color:var(--fg)}
.form{display:grid;gap:16px;max-width:640px}
.f{display:grid;gap:6px}
.f label{font-weight:600;font-size:13.5px}
.f .hint{color:var(--muted);font-size:12.5px}
.f input[type=text],.f input[type=date],.f input[type=number],.f select,.f textarea,.in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.f textarea,.in.ta{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.check{display:flex;gap:9px;align-items:flex-start;font-weight:500}
.check input{margin-top:3px;accent-color:var(--accent)}
.note{background:var(--blue-soft);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:9px}
.note .ic{color:var(--blue);margin-top:1px}
.note.warn{background:var(--amber-soft)}.note.warn .ic{color:var(--amber)}
.err{background:var(--red-soft);color:var(--red);border-radius:8px;padding:10px 12px;font-size:13px}
.err ul{margin:4px 0 0;padding-left:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--grey-soft);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px;cursor:pointer}
.chip .x{display:grid;place-items:center;border-radius:50%;width:18px;height:18px}
.chip:hover .x{background:var(--line)}
.adder{display:flex;gap:8px;flex-wrap:wrap}.adder input{flex:1;min-width:160px}
.timeline{list-style:none;margin:0;padding:0;display:grid}
.timeline li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);z-index:1}
.timeline .done .mk{background:var(--green);border-color:var(--green);color:var(--surface)}
.timeline .cur .mk{border-color:var(--accent)}
.timeline .cur .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.timeline .ret .mk{border-color:var(--red);background:var(--red-soft)}
.timeline b{font-weight:600;display:block}
.timeline .sub{color:var(--muted);font-size:12.5px}
.timeline .todo-line{color:var(--faint)}
.trail{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.trail li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;font-size:13px}
.trail .d{color:var(--muted);font-variant-numeric:tabular-nums}
.case{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}
.paperwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;overflow-x:auto}
.paper{background:var(--paper);color:var(--ink);font-family:var(--letter);font-size:14.5px;line-height:1.55;max-width:640px;min-width:300px;margin:0 auto;padding:44px 50px 36px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.06);border-radius:2px}
.paper p{margin:0 0 12px}
.lt-mast{display:flex;justify-content:flex-end;font-family:var(--font);font-weight:700;font-size:11px;letter-spacing:.14em;color:#b3141f;margin-bottom:26px}
.lt-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px;font-size:13.5px}
.lt-title{text-align:center;font-weight:700;text-decoration:underline;margin:6px 0 16px}
.lt-rec{display:grid;grid-template-columns:170px minmax(0,1fr);gap:4px 10px;margin:0 0 16px}
.lt-rec .h{grid-column:1/-1;font-weight:700;text-decoration:underline;margin-top:8px}
.lt-sig{margin-top:22px}
.lt-foot{margin-top:34px;padding-top:10px;border-top:1px solid #d9d6d1;font-size:11.5px;font-style:italic;color:#555;text-align:center}
.paper .ph{color:#8a8a8a}
.show-fields .fld{background:var(--fieldmark);border-radius:2px;box-shadow:0 0 0 1px var(--fieldmark)}
mark.miss{background:#fde2e3;color:#a1121b;border-radius:2px;padding:0 2px;font-family:var(--font);font-size:12.5px;font-weight:600}
.draftbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.editors{display:grid;gap:14px;margin-bottom:14px}
.lib{display:grid;gap:10px}
.libitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:13px}
.libitem q{font-family:var(--letter);font-size:14px;quotes:none}
.libitem .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.fbtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fbtn .n{font-variant-numeric:tabular-nums;opacity:.7}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px}
table.slim{min-width:560px}table.slim td{vertical-align:middle}
.cell{display:flex;gap:10px;align-items:center}.cell .tile{width:30px;height:30px}
td.chevcell{color:var(--muted);width:36px}
th,td{text-align:left;padding:11px 14px;border-top:1px solid var(--line-2);vertical-align:top}
th{border-top:none;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--panel)}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--panel)}
td .s{display:block;color:var(--muted);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.qcard{display:grid;gap:14px}
.qhead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.qhead .txt{flex:1;min-width:200px}
.qhead b{font-size:15.5px}
.qhead span{display:block;color:var(--muted);font-size:13px}
.datecheck{display:grid;gap:6px}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:2px}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:2px;background:var(--fieldmark);display:inline-block}
.search{max-width:360px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:9px;font-weight:500;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:20}
@media (max-width:980px){.case{grid-template-columns:minmax(0,1fr)}}
@media (max-width:780px){
  .frame{grid-template-columns:minmax(0,1fr)}
  .side{border-right:none;border-bottom:1px solid var(--line);padding:14px 12px;gap:10px}
  .navwrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
  .navsec{display:flex;gap:6px}.navsec>span{display:none}
  .nav{width:auto;white-space:nowrap}
  .content{padding:20px 16px 32px}
  .pg h2{font-size:24px}
  .paper{padding:28px 24px 30px}
  .lt-rec{grid-template-columns:130px minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

</div>

const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const fmtDate=iso=>{const [y,m,d]=iso.split('-').map(Number);return `${ord(d)} ${MONTHS[m-1]} ${y}`};
const sd=iso=>{const [y,m,d]=iso.split('-').map(Number);return `${d} ${MONTHS[m-1].slice(0,3)} ${y}`};
const joinAnd=a=>a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:(a[0]||'');
function dateList(arr){
  const ds=[...arr].sort(); if(!ds.length) return '';
  if(ds.every(x=>x.slice(0,7)===ds[0].slice(0,7))){const [y,m]=ds[0].split('-').map(Number);return `${joinAnd(ds.map(x=>ord(+x.slice(8))))} ${MONTHS[m-1]} ${y}`}

}

const S=(k,label,owner)=>({k,label,owner});
const DONE=S('done','Letter viewable to staff','');
function route(r){
  const t=r.type,f=r.fields||{},official=t==='visa'&&f.trip==='official';
  const out=[t.startsWith('release')?S('submit','Request logged by Employee Relations','Employee Relations Lead'):S('submit','Staff request','Staff')];
  if(t==='academic_excuse') out.push(S('lm','Line manager approves the class dates','Line manager'));
  if(t==='visa') out.push(S('lm',official?'Line manager approves the official trip':'Line manager approves the leave duration','Line manager'));
  if(t==='financial_reference'||(t==='job_opportunity'&&f.includeSalary)||(t==='visa'&&!official&&f.includeSalary)) out.push(S('tr','Total Rewards enters gross salary','Total Rewards'));
  out.push(S('er',t==='academic_reference'||t.startsWith('release')?'Employee Relations Lead drafts and reviews':'Employee Relations Lead reviews','Employee Relations Lead'));
  out.push(S('appr','ER & Engagement Manager or Head of TR & ER approves','Approver'));
  out.push(DONE);
  return out;
}
const key=r=>route(r)[r.step].k;
const isOpen=r=>!r.closed&&key(r)!=='done';
function status(r,forStaff){
  if(r.closed==='declined') return ['Declined','red'];
  if(r.closed==='cancelled') return ['Cancelled','grey'];
  if(r.returned) return [forStaff?'Returned to you':'Returned to staff','red'];
  const k=key(r);
  if(k==='lm') return ['With line manager','amber'];
  if(k==='done') return [r.delivery==='printed'?'Ready for collection':'Issued','green'];
  if(forStaff) return ['In progress','blue'];
  if(k==='tr') return ['With Total Rewards','amber'];
  if(k==='appr') return ['Awaiting approval','amber'];
  return ['With Employee Relations Lead','blue'];
}

function todoCount(role){

}

/* ---------- letter rendering (the 7 templates + official trip format) ---------- */
function renderLetter(r){
  const e=EMP[r.emp],p=pr(e),f=r.fields,d=r.draft,miss=[];
  const v=(val,label)=>val?`<span class="fld">${esc(val)}</span>`:(miss.push(label),`<mark class="miss">[${esc(label)}]</mark>`);
  const lines=(t,label)=>t&&t.trim()?`<span class="fld">${t.trim().split('\n').map(esc).join('<br>')}</span>`:(miss.push(label),`<mark class="miss">[${esc(label)}]</mark>`);
  const ref=r.ref?esc(r.ref):'<span class="ph">BML/HR-____/2026 (given on approval)</span>';
  const head=`<div class="lt-mast">BANK OF MALDIVES</div><div class="lt-head"><span>Reference No: ${ref}</span><span>Date: ${fmtDate(r.issuedAt||TODAY)}</span></div>`;
  const sg=signerOf(r);
  let signBlock;
  if(sg) signBlock=`<b>${v(sg.name)}</b><br>${v(sg.title)}`;
  else signBlock=v('','signing authority');
  const sig=`<div class="lt-sig">Yours sincerely,<br><br>${signBlock}</div><div class="lt-foot">${FOOTER}</div>`;
  const nm=`${e.sal} ${e.name}`;
  const sal=r.salary?money(r.salary.amount):null;
  const rec=rows=>`<div class="lt-rec">${rows.map(x=>x[0]==='h'?`<div class="h">${x[1]}</div>`:`<div>${x[0]}:</div><div>${x[1]}</div>`).join('')}</div>`;
  const employer=[['h','The Employer'],['Name','Bank of Maldives PLC'],['Address','Head Office, No. 11, Boduthakurufaanu Magu, Male’ 20094'],['Nature of business','Commercial Bank']];
  let body='';
  switch(r.type){
   case 'visa':{
     if(f.trip==='official'){
       const att=f.attendees||[],n=att.length,who=n===2?'both attendees':n>2?'all attendees':'the attendee';
       body=`<div class="lt-title">TO WHOM IT MAY CONCERN</div>
       <p>Please be advised that the following personnel from Bank of Maldives PLC will be attending the ${v(f.event,'event name')} held in ${v(f.location,'location')}. The event will be held from ${v(f.start&&f.end&&rangeText(f.start,f.end),'event dates')}.${f.sponsored?` The Bank will sponsor the meeting expenses for ${who}.`:''}</p>
       ${att.map(a=>{const x=EMP[a.emp],parts=x.name.split(' '),sur=parts[parts.length-1];return rec([['Surname',v(sur.toUpperCase())],['Other Names',v(parts.slice(0,-1).join(' ').toUpperCase())],['Job Title',v(x.position.toUpperCase())],['Passport Number',v(a.passport,'passport number')]])}).join('')}
       <p>Kindly please arrange to issue ${f.visaType?v(f.visaType)+' ':''}VISA for the above purpose.</p>`;
     }else{
       const from=f.leaveFrom||f.start,to=f.leaveTo||f.end;
       body=`<p>${lines(d.addressee,'embassy address')}</p><p>Dear Sir/Madam,</p>
       <p>Please be advised that ${v(nm)} holding Maldivian Passport Number ${v(f.passport,'passport number')} has been employed with Bank of Maldives since ${v(fmtDate(e.doj))}. ${cap(p.he)} is currently working as ${aan(e.position)} ${v(e.position)} at our ${v(e.unit)}${f.includeSalary?` and earns a monthly gross salary of ${v(sal,'gross salary from Total Rewards')}`:''}.</p>
       <p>We understand that ${p.he} is applying for visa to travel during ${p.his} Annual Leave period from ${v(from&&fmtDate(from),'leave start')} to ${v(to&&fmtDate(to),'leave end')}, for which we have no objection.</p>`;
     }
     break}
   case 'academic_excuse':{
     const dates=f.approvedDates||f.dates||[];const inst=f.institution||'';
     const kind=/college/i.test(inst)?'College':/universit/i.test(inst)?'University':/school/i.test(inst)?'School':'institution';
     body=`<p>${lines(d.recipient,'college address')}</p><p>Dear Sir/Madam,</p>
     <p>This is to inform that ${v(nm)}, National Identity Card (${v(e.nid)}), working as ${aan(e.position)} ${v(e.position)} at our ${v(e.unit)} and currently a student at your esteemed ${kind} was unable to attend classes on ${v(dateList(dates),'dates approved by line manager')} as ${p.he} was required to attend important work related responsibilities.</p>
     <p>We understand that 80% attendance is required to be eligible to sit in the exam. Therefore, we humbly request you to excuse ${p.him} for the above mentioned classes without affecting ${p.his} eligibility to sit for exam.</p>`;break}
   case 'academic_reference':
     body=`<p>${lines(d.recipient,'institution address')}</p><p>Dear Sir/Madam,</p>
     <p>This is to confirm that ${v(nm)} (NID: ${v(e.nid)}) has been employed with Bank of Maldives PLC since ${v(fmtDate(e.doj))}. Currently, ${p.he} is working as ${aan(e.position)} ${v(e.position)} in our ${v(e.unit)}.</p>
     <p>We understand that to develop professionally and improve ${p.his} career prospects, ${p.he} intends to pursue further education. In this regard, we believe ${p.he} will make a valuable contribution to any endeavor ${p.he} wishes to undertake.</p>`;break;
   case 'financial_reference':
     body=`<div class="lt-title">EMPLOYMENT RECORD</div>${rec([...employer,['h','The Employee'],['Name',v(e.name)],['Identity Card number',v(e.nid)],['Date of appointment',v(fmtDate(e.doj))],['Service period',v(service(e.doj,TODAY))],['Present position',v(e.position)],['Place of employment',v(e.unit+', '+e.dept)+'.'],['Employment type',v(e.etype)+'.'],['Gross Salary',v(sal&&sal+' per month','gross salary from Total Rewards')+'.']])}`;break;
   case 'job_opportunity':{
     const h=f.earlier&&e.history&&e.history.length?POSITIONS[e.history[0]]:null;
     const intro=h?`You have been employed with Bank of Maldives PLC since ${v(fmtDate(e.doj))}. Initially you joined as ${aan(h.title)} ${v(h.title)} at our ${v(h.unit)} and presently you are working as ${aan(e.position)} ${v(e.position)} at our ${v(e.unit)}.`:`You have been employed with Bank of Maldives PLC since ${v(fmtDate(e.doj))} as ${aan(e.position)} ${v(e.position)} at our ${v(e.unit)}.`;
     body=`<p>${v(nm)}<br>${v(e.position)}<br>${v(e.unit)}<br>${v(e.dept)}<br>${v(e.div)}<br>Bank of Maldives PLC</p><p>Dear ${v(e.first)},</p>
     <p>${intro}</p><p>As ${aan(e.position)} ${v(e.position)}, you are ${v(d.jd,'role summary')}.</p>${d.extra&&d.extra.trim()?`<p>${v(d.extra.trim())}</p>`:''}${f.includeSalary?`<p>Your current monthly gross salary is ${v(sal,'gross salary from Total Rewards')}.</p>`:''}<p>We wish you success in your career pursuits.</p>`;break}
   case 'release_reference':
     body=`<p><b>Reference letter of: ${v(nm)} (NID: ${v(e.nid)})</b></p><div class="lt-title">TO WHOM IT MAY CONCERN</div>
     <p>This is to confirm that ${v(nm)} was employed with Bank of Maldives PLC from ${v(fmtDate(e.doj))} to ${v(e.dor&&fmtDate(e.dor),'release date')} as ${aan(e.position)} ${v(e.position)} at our ${v(e.unit)}.</p>
     <p>As ${aan(e.position)} ${v(e.position)}, ${p.he} was ${v(d.jd,'role summary')}.</p><p>We wish ${p.him} success in ${p.his} future endeavors.</p>`;break;
   case 'release_general':
     body=`<div class="lt-title">EMPLOYMENT RECORD</div>${rec([...employer,['h','The Employee'],['Name',v(e.name)],['Identity Card number',v(e.nid)],['Duration',v(fmtDate(e.doj))+' – '+v(e.dor&&fmtDate(e.dor),'release date')],['Service period',v(service(e.doj,e.dor||TODAY))],['Job position',v(e.position)],['Place of employment',v(e.unit+', '+e.dept)+'.']])}`;break;
  }
  return {html:head+body+sig,miss};
}

/* ---------- shared bits ---------- */
function summary(r){
  const f=r.fields;
  switch(r.type){
   case 'visa':return f.trip==='official'?`Official trip · ${f.event} · ${sd(f.start)} to ${sd(f.end)}`:`Annual leave · ${f.embassy} · ${sd(f.start)} to ${sd(f.end)}${f.includeSalary?' · with salary':''}`;
   case 'academic_excuse':return `${f.institution} · ${(f.dates||[]).length} class date${(f.dates||[]).length===1?'':'s'}`;
   case 'academic_reference':return f.institution;
   case 'financial_reference':return f.purpose;
   case 'job_opportunity':return f.includeSalary?'Employment reference · with salary':'Employment reference';
   default:return 'Former employee';
  }
}
const tile=r=>{const [,t]=status(r,true);return `<div class="tile t-${t}">${ic(TYPES[r.type].icon)}</div>`};
const empty=(b,s)=>`<div class="empty"><b>${b}</b>${s}</div>`;
const seniorFlag=e=>isSenior(e)?` <span class="flag">${ic('info',12)} Director / Chief</span>`:'';
function fieldRows(r,forStaff){
  const f=r.fields,rows=[];
  if(r.type==='visa'){
    rows.push(['Purpose',f.trip==='official'?'Official Trip':'Annual Leave'],['Letter for',embLabel(f.embassy)]);
    if(f.trip==='official'){rows.push(['Event',f.event],['Location',f.location],['Event dates',`${sd(f.start)} to ${sd(f.end)}`],['Expenses',f.sponsored?'Sponsored by the Bank':'Not sponsored']);if(f.visaType)rows.push(['Visa type',f.visaType]);rows.push(['Attendees',(f.attendees||[]).map(a=>`${EMP[a.emp].name} (${a.passport})`).join(', ')])}
    else{rows.push(['Travel dates',`${sd(f.start)} to ${sd(f.end)} (${dayCount(f.start,f.end)} days)`]);if(f.leaveFrom)rows.push(['Leave approved',`${sd(f.leaveFrom)} to ${sd(f.leaveTo)}`]);rows.push(['Passport number',f.passport],['Salary in letter',f.includeSalary?'Yes':'No'])}
  }
  if(r.type==='academic_excuse'){rows.push(['Institution',f.institution],['Class dates missed',(f.dates||[]).map(sd).join(', ')]);if(f.approvedDates)rows.push(['Dates approved',f.approvedDates.map(sd).join(', ')||'None']);rows.push([forStaff?'Work reason':'Work reason (manager and ER only)',f.reason])}
  if(r.type==='academic_reference') rows.push(['Institution',f.institution]);
  if(r.type==='financial_reference') rows.push(['Purpose',f.purpose]);
  if(r.type==='job_opportunity'){rows.push(['Earlier roles',f.earlier?'Mention earlier roles':'Current role only'],['Salary in letter',f.includeSalary?'Yes':'No']);if(f.extra)rows.push(['Additional information',f.extra])}
  if(r.via) rows.push(['Received via',r.via]);
  if(f.note) rows.push(['Note',f.note]);
  if(r.type==='visa') rows.push(['Copy',r.delivery==='printed'?'Digital and printed (collect from Employee Relations)':'Digital only']);
  return `<dl class="kv">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
}

function staffTimeline(r){
  const full=route(r),hasLm=full.some(s=>s.k==='lm');
  const R=[full[0],...(hasLm?[S('lm','Line manager confirms the dates','')]:[]),S('prep','Letter being prepared',''),S('done','Letter issued','')];
  const k=key(r),cs=k==='submit'?0:k==='lm'?1:k==='done'?R.length-1:R.length-2;
  return `<ol class="timeline">${R.map((s,i)=>{
    let cls='',sub='';
    if(r.closed&&i>=cs){cls=i===cs?'ret':'';sub=i===cs?(r.closed==='declined'?'Declined':'Cancelled'):''}
    else if(i<cs||(i===cs&&s.k==='done')){cls='done';sub=i===0?sd(r.submitted):(s.k==='done'&&r.issuedAt?`${sd(r.issuedAt)} · ${r.ref}`:'')}
    else if(i===cs){cls=r.returned?'ret':'cur';sub=r.returned?'Returned to you for changes':s.k==='lm'?`With ${mgrName(EMP[r.emp])}`:'In progress'}
    return `<li class="${cls}"><span class="mk">${cls==='done'?ic('check',12):''}</span><div><b class="${!cls?'todo-line':''}">${s.label}</b>${sub?`<span class="sub">${esc(sub)}</span>`:''}</div></li>`}).join('')}</ol>`;
}

  const salaryBox=`<label class="check"><input type="checkbox" id="includeSalary" data-f="includeSalary" ${V.includeSalary?'checked':''}> Include ${you} gross salary in the letter</label>`;
  let fields='';

   case 'academic_excuse':fields=`

     ${can?`<div class="two"><div class="f"><label for="lf_${r.id}">Leave approved from</label><input type="date" id="lf_${r.id}" value="${f.start}"></div><div class="f"><label for="lt_${r.id}">Leave approved to</label><input type="date" id="lt_${r.id}" value="${f.end}"></div></div><span class="mono">These dates are printed on the visa letter.</span>`:''}`;

let tt;
function toast(m){const h=document.getElementById('toastHost');h.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>h.innerHTML='',3800)}
const R=id=>REQS.find(r=>r.id===id);
const log=(r,what)=>r.trail.push(T(TODAY,actor().name,what));
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
function captureForm(){document.querySelectorAll('[data-f]').forEach(el=>st.form.values[el.dataset.f]=el.type==='checkbox'?el.checked:el.value)}
function advance(r,what){r.step++;log(r,what)}
const newForm=forEmp=>({forEmp:forEmp||null,type:null,values:{},dates:[],attendees:[],errors:[],editing:null});

function submitForm(){
  captureForm();
  const F=st.form,V=F.values,E=[];
  const official=F.type==='visa'&&V.trip==='official';
  if(F.type==='academic_excuse'){if(!V.institution)E.push('Choose the institution.');if(!F.dates.length)E.push('Add at least one class date.');if(!V.reason)E.push('Explain the work reason for the line manager.')}
  if(F.type==='academic_reference'&&!V.institution)E.push('Choose the institution.');
  if(V.institution==='Other'&&!(V.institutionOther||'').trim())E.push('Type the institution name.');
  if(F.type==='financial_reference'&&!V.purpose)E.push('Say what the letter is for.');
  if(F.type==='visa'){
    if(!V.embassy)E.push('Choose the embassy the letter is for.');
    if(V.embassy==='Other'&&!(V.embassyOther||'').trim())E.push('Type the embassy name.');
    if(official){if(!V.event)E.push('Enter the event or meeting.');if(!V.location)E.push('Enter where it is held.')}
    if(!V.start||!V.end)E.push(official?'Enter both event dates.':'Enter both travel dates.');else if(V.end<V.start)E.push('The end date is before the start date.');else if(V.start<=TODAY)E.push('Travel must start after today.');
    if(!V.passport)E.push('Enter the passport number.');
  }
  if(F.type!=='visa')V.delivery='digital';
  F.errors=E; if(E.length) return render();
  const a=actor(),empId=F.forEmp||a.emp,e=EMP[empId];
  const fields={...V};delete fields.delivery;
  if(fields.institution==='Other')fields.institution=fields.institutionOther.trim();delete fields.institutionOther;
  if(fields.embassy==='Other')fields.embassy=fields.embassyOther.trim();delete fields.embassyOther;
  if(F.type==='academic_excuse')fields.dates=[...F.dates].sort();
  if(F.type==='visa'){fields.trip=fields.trip||'annual';if(official){fields.includeSalary=false;fields.attendees=[{emp:empId,passport:V.passport},...F.attendees]}}
  let r;
  if(F.editing){r=R(F.editing);r.fields=fields;r.delivery=V.delivery||'digital';r.step=1;r.returned=null;r.draft=makeDraft(r.type,e,fields);delete r.salary;log(r,'Updated and resubmitted the request')}
  else{r=mk({id:`RL-2026-${String(nextReq++).padStart(4,'0')}`,type:F.type,emp:empId,step:1,submitted:TODAY,delivery:V.delivery||'digital',fields,trail:[T(TODAY,a.name,F.forEmp?`Submitted on behalf of ${e.name}`:'Submitted the request in OneUI')]});REQS.push(r)}
  st.form=null;st.sel=r.id;
  if(F.forEmp){st.view='inbox';render();toast(`${r.id} created for ${e.name}.`)}
  else{render();toast(`${r.id} sent. Letters will be issued within 3 working days.`)}
}
function issue(r){
  r.signedBy=r.draft.signer;
  r.ref=`BML/HR-${nextRef++}/2026`;r.issuedAt=TODAY;r.step=route(r).length-1;
  log(r,`Approved and issued ${r.ref}`);
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,id=t.dataset.id;
  switch(act){
   case 'nav':st.view=t.dataset.v;st.sel=null;st.tf='pending';st.showLetter=false;st.form=null;st.err={};st.search='';render();break;
   case 'stub':toast(`${t.dataset.l} is part of your existing Employee Relations app and is not in this prototype.`);break;
   case 'theme':{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=cur==='dark'?'light':'dark';break}
   case 'bell':{const n=todoCount(st.role);if(n){st.view=ROLES[st.role].home;st.sel=null;st.form=null;if(st.role==='erl')st.filter='action';render()}toast(n?`${n} item${n>1?'s':''} waiting for you.`:'No new notifications.');break}
   case 'new':st.form=newForm();st.sel=null;render();break;
   case 'behalf-go':{const emp=val('bh_emp');if(!emp){st.err.behalf='Choose the staff member.';return render()}delete st.err.behalf;st.form=newForm(emp);render();break}
   case 'pick':st.form.type=t.dataset.t;st.form.values={delivery:'digital',earlier:false,includeSalary:false,trip:'annual',sponsored:true};st.form.errors=[];st.form.attendees=[];render();break;
   case 'pickagain':st.form=newForm(st.form.forEmp);render();break;
   case 'adddate':{captureForm();const d=val('newDate');if(!d){toast('Pick a date first.');break}if(d>TODAY){toast('Class dates must be today or earlier.');break}if(!st.form.dates.includes(d))st.form.dates.push(d);st.form.dates.sort();render();document.getElementById('newDate')?.focus();break}
   case 'rmdate':captureForm();st.form.dates=st.form.dates.filter(x=>x!==t.dataset.d);render();break;
   case 'addatt':{captureForm();const emp=val('attEmp'),pp=val('attPass');if(!emp||!pp){toast('Choose a colleague and enter their passport number.');break}st.form.attendees.push({emp,passport:pp});render();break}
   case 'rmatt':captureForm();st.form.attendees=st.form.attendees.filter(a=>a.emp!==t.dataset.e);render();break;
   case 'submit':submitForm();break;
   case 'edit':{const r=R(id),vals={...r.fields,delivery:r.delivery};
     if(vals.institution&&!INSTITUTIONS.includes(vals.institution)){vals.institutionOther=vals.institution;vals.institution='Other'}
     if(vals.embassy&&!EMBASSIES[vals.embassy]){vals.embassyOther=vals.embassy;vals.embassy='Other'}
     st.form={...newForm(),type:r.type,values:vals,dates:[...(r.fields.dates||[])],attendees:(r.fields.attendees||[]).slice(1),editing:id};render();break}
   case 'cancel':{const r=R(id);if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.textContent='Select again to cancel the request';break}r.closed='cancelled';log(r,'Cancelled the request');render();toast(`${r.id} cancelled.`);break}
   case 'pdf':toast('In the live app this downloads the PDF from OneUI.');break;
   case 'toggleletter':st.showLetter=!st.showLetter;render();break;
   case 'tfilter':st.tf=t.dataset.k;render();break;
   case 'open':st.sel=id;st.showLetter=false;if(st.view==='library')st.view='inbox';render();break;
   case 'openinbox':st.view='inbox';st.sel=id;render();break;
   case 'back':st.showLetter=false;if(st.form){st.form=null}else st.sel=null;st.err={};render();break;
   case 'filter':st.filter=t.dataset.k;render();break;
   case 'lm-approve':{const r=R(id),c=val('lc_'+id),f=r.fields;
     if(r.type==='visa'&&f.trip==='official') advance(r,`Approved the official trip, ${sd(f.start)} to ${sd(f.end)}`);
     else if(r.type==='visa'){const a=val('lf_'+id),b=val('lt_'+id);if(!a||!b||b<a){st.err[id]='Enter a valid leave period.';return render()}f.leaveFrom=a;f.leaveTo=b;advance(r,`Approved leave duration ${sd(a)} to ${sd(b)}`)}
     else{const ds=[...document.querySelectorAll(`[data-lmdate="${id}"]:checked`)].map(x=>x.value);if(!ds.length){st.err[id]='Tick at least one date, or decline the request.';return render()}f.approvedDates=ds;advance(r,`Approved ${ds.length} of ${f.dates.length} class dates`)}
     if(c)log(r,`Comment: ${c}`);delete st.err[id];st.sel=null;render();toast(`${r.id} approved and sent on to ${route(r)[r.step].owner}.`);break}
   case 'lm-return':case 'lm-decline':{const r=R(id),c=val('lc_'+id);if(!c){st.err[id]=`Add a comment so ${EMP[r.emp].name} knows why.`;return render()}
     if(act==='lm-return'){r.returned={by:actor().name,note:c};log(r,`Returned to staff: ${c}`)}else{r.closed='declined';r.closeBy=actor().name;r.closeNote=c;log(r,`Declined: ${c}`)}
     delete st.err[id];st.sel=null;render();toast(`${r.id} ${act==='lm-return'?'returned to':'declined for'} ${EMP[r.emp].name}.`);break}
   case 'tr-confirm':{const r=R(id),amt=parseFloat(val('ta_'+id));
     if(!(amt>0)){st.err[id]='Enter the gross monthly salary.';return render()}
     r.salary={amount:amt,by:actor().name,d:TODAY};advance(r,`Entered gross salary ${money(amt)}`);delete st.err[id];st.sel=null;render();toast(`Salary saved for ${EMP[r.emp].name}.`);break}
   case 'usejd':{const r=R(id),l=LIBRARY.find(x=>x.ref===t.dataset.ref);r.draft.jd=coreOf(l.text);r.draft.jdSource='Earlier letter '+l.ref;render();toast(`Wording from ${l.ref} added to the draft.`);break}
   case 'jdreset':{const r=R(id);r.draft.jd=POSITIONS[EMP[r.emp].pos].summary;r.draft.jdSource='Position master';render();break}
   case 'er-send':{const r=R(id);r.apprReturn=null;advance(r,'Reviewed the draft and sent it for approval');render();toast(`${r.id} sent for approval.`);break}
   case 'er-return':{const r=R(id),c=val('ern');if(!c){st.err[id]='Write a note to the staff member before returning.';return render()}r.returned={by:actor().name+', Employee Relations',note:c};log(r,`Returned to staff: ${c}`);delete st.err[id];render();toast(`${r.id} returned to ${EMP[r.emp].name}.`);break}

   case 'appr-return':{const r=R(id),c=val('en_'+id);if(!c){st.err[id]='Add a comment for the Employee Relations Lead.';return render()}r.step--;r.apprReturn={by:actor().name,note:c};log(r,`Returned to Employee Relations Lead: ${c}`);delete st.err[id];st.sel=null;render();toast(`${r.id} returned to the Employee Relations Lead.`);break}
   case 'log':{const emp=val('rl_emp');if(!emp){st.err.log='Choose the former employee.';return render()}

     REQS.push(r);delete st.err.log;st.view='inbox';st.sel=r.id;render();toast(`${r.id} logged.`);break}
  }

  const el=ev.target;
  if(el.id==='psearch'||el.id==='lsearch'){st.search=el.value;const pos=el.selectionStart;render();const n=document.getElementById(el.id);n.focus();n.setSelectionRange(pos,pos);return}
  const k=el.dataset.d;if(!k||!st.sel||k==='signer')return;
  const r=R(st.sel);r.draft[k]=el.value;if(k==='jd')r.draft.jdSource='Edited by Employee Relations Lead';
  const L=renderLetter(r);document.getElementById('paper').innerHTML=L.html;document.getElementById('missBox').innerHTML=missBox(L,r);
  document.querySelectorAll('[data-act="er-send"]').forEach(b=>b.disabled=!!L.miss.length);
});
document.addEventListener('change',ev=>{
  const id=ev.target.id;
  if(st.form&&['institution','embassy','trip'].includes(id)){captureForm();render();const f=document.getElementById(ev.target.value==='Other'?id+'Other':id);f&&f.focus()}
  if(id==='d_signer'&&st.sel){R(st.sel).draft.signer=ev.target.value;render()}
});
document.getElementById('roleSel').addEventListener('change',ev=>{st.role=ev.target.value;st.view=ROLES[st.role].home;st.sel=null;st.form=null;st.err={};st.filter='action';st.search='';st.tf='pending';st.showLetter=false;render()});
render();
</script>
